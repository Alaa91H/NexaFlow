<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
        onerror="this.onerror=null;this.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'"></script>
<style>
  html, body, #map { height: 100%; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map', { zoomControl: true }).setView([0, 0], 2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  var marker = null;
  var circle = null;
  var radius = 100;

  function drawPoint(lat, lng, move) {
    if (marker) {
      marker.setLatLng([lat, lng]);
    } else {
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', function () {
        var p = marker.getLatLng();
        if (circle) circle.setLatLng(p);
        if (window.Android) window.Android.onPointSelected(p.lat, p.lng);
      });
    }
    if (circle) {
      circle.setLatLng([lat, lng]);
    } else {
      circle = L.circle([lat, lng], {
        radius: radius,
        color: '#1a73e8',
        fillColor: '#1a73e8',
        fillOpacity: 0.2
      }).addTo(map);
    }
    if (move) map.setView([lat, lng], 16);
  }

  // Called from the Android side (search result / current location / init).
  window.setPoint = function (lat, lng, r) {
    if (typeof r === 'number') radius = r;
    drawPoint(lat, lng, true);
  };
  window.setRadius = function (r) {
    radius = r;
    if (circle) circle.setRadius(r);
  };

  map.on('click', function (e) {
    drawPoint(e.latlng.lat, e.latlng.lng, false);
    if (window.Android) window.Android.onPointSelected(e.latlng.lat, e.latlng.lng);
  });
</script>
</body>
</html>

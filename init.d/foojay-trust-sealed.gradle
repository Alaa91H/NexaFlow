// P2-4: Gradle's signature verifier rejects the Foojay resolver convention
// plugin's own POM (it is a self-referencing Gradle metadata artifact), so
// the Gradle Central Plugin Repository must be allowed to treat sealed POMs as
// trusted when resolving toolchain plugins. This init script only affects
// resolution of toolchain plugins; it does not disable verification globally.
//
// v1.0.0/final is a GPG-signed release with verified checksums on Gradle Central;
// the same convention was in use for every prior SemVer release.

rootProject.buildscript {
    repositories {
        // Trust the already-sealed Gradle Central metadata for Foojay so the
        // resolver convention resolves before buildSrc configuration completes.
        maven {
            url = uri("https://plugins.gradle.org/m2")
            content {
                includeGroup("org.gradle.toolchains.foojay-resolver-convention")
            }
        }
    }
}

pluginManagement {
    repositories {
        maven {
            url = uri("https://plugins.gradle.org/m2")
            content {
                includeGroup("org.gradle.toolchains.foojay-resolver-convention")
            }
        }
    }
}
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Wearable Data Layer security requires the phone and watch APKs to use
# the same installed package name (and release signing certificate).
# Both :app and :wear consume this single value to prevent identity drift.
nexaflow.applicationId=com.nexaflow.app
# P2-8: build performance
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.parallel=true
kotlin.daemon.jvmargs=-Xmx3072m


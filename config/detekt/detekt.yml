# NexaFlow curated Detekt configuration (P2-8).
# Built on top of the default rule set; noisy/stylistic rules that would
# produce hundreds of findings without catching real bugs are disabled.

style:
  active: true
  MagicNumber:
    active: false
  # Compose @Preview functions look "unused" to detekt; the valuable check is
  # UnusedPrivateProperty (dead fields), which stays active.
  UnusedPrivateFunction:
    active: false
  UnusedPrivateProperty:
    active: true
  WildcardImport:
    active: false
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  ForbiddenComment:
    active: false
  UnusedParameter:
    active: true
  LoopWithTooManyJumpStatements:
    active: false

complexity:
  active: true
  CyclomaticComplexMethod:
    active: false
  CognitiveComplexMethod:
    active: false
  # NFA-06: size/complexity is now measured instead of frozen off. The
  # thresholds are deliberately lenient for the first cycle and every
  # pre-existing offender is captured in the per-module baselines, so these
  # rules fail on new debt only. Tighten the thresholds (and shrink the
  # baselines) each cycle once the top files are decomposed.
  LongMethod:
    active: true
    allowedLines: 200
  NestedBlockDepth:
    active: true
    allowedDepth: 6
  LongParameterList:
    active: false
  ComplexCondition:
    active: false
  TooManyFunctions:
    allowedFunctionsPerClass: 50
    allowedFunctionsPerObject: 25
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerFile: 40
  LargeClass:
    active: true
    allowedLines: 900

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: false
  SuspendFunSwallowedCancellation:
    active: true

empty-blocks:
  active: true
  severity: error
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '^$'

naming:
  active: true
  FunctionNaming:
    active: false
  VariableNaming:
    active: false
  # Files holding both a composable dialog and its data classes (InstalledApp,
  # ConstraintDraft, …) legitimately mismatch the single-declaration rule.
  MatchingDeclarationName:
    active: false

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    severity: warning
  SwallowedException:
    active: true
    severity: warning
  PrintStackTrace:
    active: false

performance:
  active: true
  SpreadOperator:
    active: false

potential-bugs:
  active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  DoubleMutabilityForCollection:
    active: true
  UnusedUnaryOperator:
    active: true

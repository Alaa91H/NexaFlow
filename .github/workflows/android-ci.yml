name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Android Lint
      run: ./gradlew lintDebug
    - name: Upload Lint Report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
          **/build/reports/lint-results-debug.*

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
    - name: Build with Gradle
      run: ./gradlew assembleDebug assembleRelease
    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload Release APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PRERELEASE=""
        if [[ "$GITHUB_REF_NAME" == *alpha* || "$GITHUB_REF_NAME" == *beta* || "$GITHUB_REF_NAME" == *rc* ]]; then
          PRERELEASE="--prerelease"
        fi
        APK_NAME="NexaFlow-$GITHUB_REF_NAME.apk"
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          echo "Release $GITHUB_REF_NAME already exists — replacing APK asset with the latest build."
          gh release delete-asset "$GITHUB_REF_NAME" "$APK_NAME" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$GITHUB_REF_NAME" "app-release.apk" --yes >/dev/null 2>&1 || true
          gh release upload "$GITHUB_REF_NAME" "app/build/outputs/apk/release/app-release.apk#$APK_NAME" --clobber
        else
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/app-release.apk#$APK_NAME" \
            --title "NexaFlow $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
        fi

name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# A newer run for the same branch or tag supersedes an older one. This prevents
# duplicate tag deliveries from racing to publish the same release asset.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Auto-fix resource hygiene (orphans, duplicates, balance)
      # --check: the tree must already be auto-fix-clean. If this fails, run
      # `python3 scripts/auto_fix.py` locally and commit the result.
      run: python3 scripts/auto_fix.py --check
    - name: Verify string parity across all locales
      run: python3 scripts/check_strings_parity.py
    - name: Unit-test the resource gate (orphan drawable/layout/dimen)
      run: python3 scripts/tests/test_check_resources.py
    - name: Install pytest for the resource-gate suite
      run: python3 -m pip install --quiet pytest
    - name: pytest the resource gate (orphans, lint report, pins guard, auto-fix)
      run: >-
        python3 -m pytest
        scripts/tests/test_check_resources_pytest.py
        scripts/tests/test_check_lint_config.py
        scripts/tests/test_auto_fix.py
        -q
    - name: Run Detekt static analysis
      run: ./gradlew detekt
    - name: Run Android Lint
      run: ./gradlew lintDebug
    - name: Unified resource gate (banned + orphans + lint UnusedResources)
      if: always()
      run: python3 scripts/check_resources.py
    - name: Upload Lint Report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
          **/build/reports/lint-results-debug.*

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
    - name: Restore release signing keystore (when configured)
      env:
        KEYSTORE_B64: ${{ secrets.NEXAFLOW_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/nexaflow-release.jks
          echo "Release keystore restored."
          # Export an all-or-nothing signing configuration for later steps. A
          # partial configuration must never turn an ordinary main build into
          # an invalid release build; tags are rejected explicitly below.
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            {
              echo "NEXAFLOW_KEYSTORE_FILE=keystore/nexaflow-release.jks"
              echo "NEXAFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NEXAFLOW_KEY_ALIAS=$KEY_ALIAS"
              echo "NEXAFLOW_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "Release keystore credentials are incomplete; signing variables were not exported."
          fi
        else
          echo "No keystore secret configured - local/ad-hoc release builds use debug signing only."
        fi
        # The build reads NEXAFLOW_* env vars over keystore.properties.
    - name: Require production signing for version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_FILE: keystore/nexaflow-release.jks
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        NEXAFLOW_KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        test -s "$NEXAFLOW_KEYSTORE_FILE" || { echo "Version tags require NEXAFLOW_KEYSTORE_BASE64." >&2; exit 1; }
        test -n "$NEXAFLOW_KEYSTORE_PASSWORD" || { echo "Version tags require NEXAFLOW_KEYSTORE_PASSWORD." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_ALIAS" || { echo "Version tags require NEXAFLOW_KEY_ALIAS." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_PASSWORD" || { echo "Version tags require NEXAFLOW_KEY_PASSWORD." >&2; exit 1; }
    - name: Build with Gradle
      env:
        # Google Maps API key for the embedded map picker; baked into every
        # distributed APK so the map works for all users, not just local builds.
        NEXAFLOW_MAPS_API_KEY: ${{ secrets.NEXAFLOW_MAPS_API_KEY }}
      run: ./gradlew assembleRelease
    - name: Verify dependency verification metadata is up to date
      run: |
        cp gradle/verification-metadata.xml /tmp/verification-metadata.expected.xml
        ./gradlew --write-verification-metadata sha256 :app:assembleDebug --console=plain
        python3 scripts/check_verification_metadata.py \
          /tmp/verification-metadata.expected.xml gradle/verification-metadata.xml
    - name: Verify 16 KB page-size alignment of native libraries
      run: python3 scripts/check_16kb.py app/build/outputs/apk/release/app-release.apk
    - name: Verify APK signature (v1/v2/v3)
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        echo "== APK signature verification (verbose) =="
        "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        # Gate: at least one modern signature scheme (v2 or v3) must verify.
        "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk \
          | grep -E "Verified using v(2|3) scheme.*: true"
    - name: Verify production certificate matches keystore on version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        EXPECTED="$(keytool -list -v -keystore keystore/nexaflow-release.jks -storepass "$NEXAFLOW_KEYSTORE_PASSWORD" -alias "$NEXAFLOW_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$EXPECTED" || { echo "Could not read the release-keystore certificate fingerprint." >&2; exit 1; }
        test -n "$ACTUAL" || { echo "Could not read the APK certificate fingerprint." >&2; exit 1; }
        test "$EXPECTED" = "$ACTUAL" || { echo "APK certificate does not match the production keystore." >&2; exit 1; }
        echo "APK certificate matches the configured production keystore."
    - name: Verify zipalign (4 KB + 16 KB native page alignment)
      run: |
        ZIPALIGN="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | sort -V | tail -1)"
        "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
    - name: Audit native libraries (ABI + size)
      run: python3 scripts/check_apk_libs.py app/build/outputs/apk/release/app-release.apk
    - name: Upload Release APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    - name: Create or Update GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PRERELEASE=""
        if [[ "$GITHUB_REF_NAME" == *alpha* || "$GITHUB_REF_NAME" == *beta* || "$GITHUB_REF_NAME" == *rc* ]]; then
          PRERELEASE="--prerelease"
        fi
        APK_NAME="NexaFlow-$GITHUB_REF_NAME.apk"
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          echo "Release $GITHUB_REF_NAME already exists — replacing APK asset with the latest build."
          gh release delete-asset "$GITHUB_REF_NAME" "$APK_NAME" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$GITHUB_REF_NAME" "app-release.apk" --yes >/dev/null 2>&1 || true
          gh release upload "$GITHUB_REF_NAME" "app/build/outputs/apk/release/app-release.apk#$APK_NAME" --clobber
        else
          gh release create "$GITHUB_REF_NAME" \
            "app/build/outputs/apk/release/app-release.apk#$APK_NAME" \
            --title "NexaFlow $GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
        fi

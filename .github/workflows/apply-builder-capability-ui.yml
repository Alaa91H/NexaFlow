name: Apply Builder Capability Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-builder-capability-ui.yml

permissions:
  contents: write

concurrency:
  group: apply-builder-capability-discovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply capability-aware builder discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          screen_path = Path("feature/automation-builder/src/main/java/com/nexaflow/feature/builder/AutomationBuilderScreen.kt")
          screen = screen_path.read_text()

          old_state = '''    // One reactive capability-engine snapshot is composed with Android/ROM
              // compatibility. Options with no executable backend are not rendered in
              // picker, browse, common or search paths.
              val capabilitySnapshot by viewModel.capabilitySnapshot.collectAsStateWithLifecycle()
              val supportedActions = remember(context, capabilitySnapshot) {
                  CompatibilityGate.supportedActionOptions(context, capabilitySnapshot)
              }
              val supportedTriggers = remember(context, capabilitySnapshot) {
                  CompatibilityGate.supportedTriggerOptions(context, capabilitySnapshot)
              }
          '''.replace('              ', '')
          new_state = '''    // Compose one live capability snapshot with Android/ROM compatibility.
              // Unsupported entries stay hidden, while grantable or temporarily unavailable
              // entries remain discoverable and are rendered as locked rows below.
              val capabilitySnapshot by viewModel.capabilitySnapshot.collectAsStateWithLifecycle()
              val actionOptionStates = remember(context, capabilitySnapshot) {
                  CompatibilityGate.actionOptionStates(context, capabilitySnapshot)
                      .filter { it.availability != BuilderOptionAvailability.UNSUPPORTED }
              }
              val triggerOptionStates = remember(context, capabilitySnapshot) {
                  CompatibilityGate.triggerOptionStates(context, capabilitySnapshot)
                      .filter { it.availability != BuilderOptionAvailability.UNSUPPORTED }
              }
              val supportedActions = remember(actionOptionStates) { actionOptionStates.map { it.option } }
              val actionAvailabilityByType = remember(actionOptionStates) {
                  actionOptionStates.associate { it.option.actionType to it.availability }
              }
              val supportedTriggers = remember(triggerOptionStates) { triggerOptionStates.map { it.type } }
              val triggerAvailabilityByType = remember(triggerOptionStates) {
                  triggerOptionStates.associate { it.type to it.availability }
              }
          '''.replace('              ', '')
          screen = replace_once(screen, old_state, new_state, "capability state block")

          old_strings = '''    val stringLocationFixFailed = stringResource(R.string.location_fix_failed)
          '''.replace('          ', '')
          new_strings = '''    val stringLocationFixFailed = stringResource(R.string.location_fix_failed)
              val stringPermissionRequired = stringResource(R.string.permission_denied_hint)
          '''.replace('              ', '')
          screen = replace_once(screen, old_strings, new_strings, "permission string")

          helper_marker = '''    Scaffold(
          '''.replace('          ', '')
          helpers = '''    fun requestGrantForAction(type: ActionType) {
              val runtime = PermissionCatalog.runtimePermissionsFor(type)
              when {
                  runtime.isNotEmpty() -> requestPermissions(runtime.toTypedArray())
                  PermissionCatalog.specialPermissionFor(type) != null ->
                      explainSpecialPermission(PermissionCatalog.specialPermissionFor(type)!!)
                  else -> scope.launch { snackbarHostState.showSnackbar(stringPermissionRequired) }
              }
          }

              fun requestGrantForTrigger(type: TriggerType) {
              val runtime = PermissionCatalog.runtimePermissionsFor(type)
              when {
                  runtime.isNotEmpty() -> requestPermissions(runtime.toTypedArray())
                  PermissionCatalog.specialPermissionFor(type) != null ->
                      explainSpecialPermission(PermissionCatalog.specialPermissionFor(type)!!)
                  else -> scope.launch { snackbarHostState.showSnackbar(stringPermissionRequired) }
              }
          }

              Scaffold(
          '''.replace('              ', '')
          screen = replace_once(screen, helper_marker, helpers, "grant helpers")

          trigger_hook = '''                                    alternatingIndex = optionIndex,
                                              onSelect = {
          '''.replace('                                              ', '')
          trigger_replacement = '''                                    alternatingIndex = optionIndex,
                                              availability = triggerAvailabilityByType[type] ?: BuilderOptionAvailability.READY,
                                              onBlockedClick = { requestGrantForTrigger(type) },
                                              onSelect = {
          '''.replace('                                              ', '')
          trigger_count = screen.count(trigger_hook)
          if trigger_count != 2:
              raise SystemExit(f"trigger rows: expected 2 matches, found {trigger_count}")
          screen = screen.replace(trigger_hook, trigger_replacement)

          action_hook = '''                                        alternatingIndex = optionIndex,
                                                  onToggle = {
          '''.replace('                                                  ', '')
          action_replacement = '''                                        alternatingIndex = optionIndex,
                                                  availability = actionAvailabilityByType[option.actionType] ?: BuilderOptionAvailability.READY,
                                                  onBlockedClick = { requestGrantForAction(option.actionType) },
                                                  onToggle = {
          '''.replace('                                                  ', '')
          action_count = screen.count(action_hook)
          if action_count != 2:
              raise SystemExit(f"action rows: expected 2 matches, found {action_count}")
          screen = screen.replace(action_hook, action_replacement)
          screen_path.write_text(screen)

          components_path = Path("feature/automation-builder/src/main/java/com/nexaflow/feature/builder/BuilderComponents.kt")
          components = components_path.read_text()

          components = replace_once(
              components,
              '''fun ActionOptionRow(
                  option: ActionOption,
                  checked: Boolean,
                  onToggle: () -> Unit,
                  modifier: Modifier = Modifier,
                  alternatingIndex: Int? = null
              ) {'''.replace('              ', ''),
              '''internal fun ActionOptionRow(
                  option: ActionOption,
                  checked: Boolean,
                  onToggle: () -> Unit,
                  availability: BuilderOptionAvailability = BuilderOptionAvailability.READY,
                  onBlockedClick: () -> Unit = {},
                  modifier: Modifier = Modifier,
                  alternatingIndex: Int? = null
              ) {'''.replace('              ', ''),
              "action row signature"
          )
          components = replace_once(
              components,
              '''        onToggle = onToggle,
                  modifier = modifier,
                  alternatingIndex = alternatingIndex
              )
          }'''.replace('              ', ''),
              '''        onToggle = onToggle,
                  availability = availability,
                  onBlockedClick = onBlockedClick,
                  modifier = modifier,
                  alternatingIndex = alternatingIndex
              )
          }'''.replace('              ', ''),
              "action row forwarding"
          )
          components = replace_once(
              components,
              '''fun TriggerOptionRow(
                  type: TriggerType,
                  checked: Boolean,
                  onSelect: () -> Unit,
                  modifier: Modifier = Modifier,
                  alternatingIndex: Int? = null
              ) {'''.replace('              ', ''),
              '''internal fun TriggerOptionRow(
                  type: TriggerType,
                  checked: Boolean,
                  onSelect: () -> Unit,
                  availability: BuilderOptionAvailability = BuilderOptionAvailability.READY,
                  onBlockedClick: () -> Unit = {},
                  modifier: Modifier = Modifier,
                  alternatingIndex: Int? = null
              ) {'''.replace('              ', ''),
              "trigger row signature"
          )
          trigger_forward = '''        onToggle = onSelect,
              modifier = modifier,
              alternatingIndex = alternatingIndex
          )
      }

      @Composable
      private fun CatalogOptionRow('''.replace('      ', '')
          trigger_forward_new = '''        onToggle = onSelect,
              availability = availability,
              onBlockedClick = onBlockedClick,
              modifier = modifier,
              alternatingIndex = alternatingIndex
          )
      }

      @Composable
      private fun CatalogOptionRow('''.replace('      ', '')
          components = replace_once(components, trigger_forward, trigger_forward_new, "trigger row forwarding")

          components = replace_once(
              components,
              '''    checked: Boolean,
                  onToggle: () -> Unit,
                  modifier: Modifier,
                  alternatingIndex: Int?
              ) {
                  val rowSurface = alternatingIndex?.let { alternatingSurfaceColor(it) }
          '''.replace('              ', ''),
              '''    checked: Boolean,
                  onToggle: () -> Unit,
                  availability: BuilderOptionAvailability,
                  onBlockedClick: () -> Unit,
                  modifier: Modifier,
                  alternatingIndex: Int?
              ) {
                  val rowSurface = alternatingIndex?.let { alternatingSurfaceColor(it) }
                  val isReady = availability == BuilderOptionAvailability.READY
                  val isGrantable = availability == BuilderOptionAvailability.PERMISSION_REQUIRED
                  val lockedMessage = when (availability) {
                      BuilderOptionAvailability.READY -> null
                      BuilderOptionAvailability.PERMISSION_REQUIRED -> stringResource(R.string.permission_denied_hint)
                      BuilderOptionAvailability.UNAVAILABLE,
                      BuilderOptionAvailability.UNSUPPORTED -> stringResource(R.string.elevated_status_unavailable)
                  }
          '''.replace('              ', ''),
              "catalog row state"
          )
          components = replace_once(
              components,
              '''            .clickable(onClick = onToggle)
          '''.replace('          ', ''),
              '''            .clickable(
                  enabled = isReady || isGrantable,
                  onClick = if (isReady) onToggle else onBlockedClick
              )
          '''.replace('          ', ''),
              "catalog row click"
          )
          components = replace_once(
              components,
              '''            Text(
                  text = subtitle,
                  style = MaterialTheme.typography.bodySmall,
                  color = MaterialTheme.colorScheme.secondary
              )
          '''.replace('          ', ''),
              '''            Text(
                  text = subtitle,
                  style = MaterialTheme.typography.bodySmall,
                  color = MaterialTheme.colorScheme.secondary
              )
                  lockedMessage?.let { message ->
                  Text(
                      text = message,
                      style = MaterialTheme.typography.labelSmall,
                      color = if (isGrantable) NexaFlowTheme.colors.warning else MaterialTheme.colorScheme.secondary
                  )
              }
          '''.replace('          ', ''),
              "locked message"
          )
          components = replace_once(
              components,
              '''        Checkbox(
              checked = checked,
              onCheckedChange = { onToggle() }
          )
      }
          '''.replace('      ', ''),
              '''        if (isReady) {
              Checkbox(
                  checked = checked,
                  onCheckedChange = { onToggle() }
              )
          } else {
              StatusPill(
                  text = stringResource(
                      if (isGrantable) R.string.elevated_status_available else R.string.elevated_status_unavailable
                  ),
                  background = if (isGrantable) {
                      NexaFlowTheme.colors.warningContainer
                  } else {
                      MaterialTheme.colorScheme.surfaceContainerHighest
                  },
                  contentColor = if (isGrantable) {
                      NexaFlowTheme.colors.warning
                  } else {
                      MaterialTheme.colorScheme.secondary
                  }
              )
          }
      }
          '''.replace('      ', ''),
              "catalog row trailing state"
          )
          components_path.write_text(components)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          anchor = '''- **Shizuku is now the preferred compatibility provider for shared elevated capabilities.**
        The legacy compatibility selector follows the same least-privilege ordering as the modern
        capability resolver, while Root remains exclusive for `ROOT_SHELL`.
      '''.replace('      ', '')
          expanded = anchor + '''- **Builder capability discovery now keeps grantable features visible without making them executable.**
        The trigger and action catalogues distinguish ready, permission-required, temporarily unavailable,
        and unsupported capabilities from the same live snapshot. Grantable rows stay discoverable with an
        explicit locked state and route into the existing permission flow; unsupported rows remain hidden.
      - **Release automation now gates version tags on the latest green `main` commit.**
        A changelog-backed release candidate is tagged only after Android CI succeeds for the current head,
        then the tag build is dispatched explicitly so production-signing, certificate, APK/AAB, alignment,
        and release checks cannot be skipped by GitHub token recursion protections.
      '''.replace('      ', '')
          changelog = replace_once(changelog, anchor, expanded, "v3.69 changelog")
          changelog_path.write_text(changelog)
          PY

      - name: Remove one-shot workflow and commit result
        run: |
          set -euo pipefail
          rm .github/workflows/apply-builder-capability-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: expose grantable builder capabilities"
          git push origin HEAD:main

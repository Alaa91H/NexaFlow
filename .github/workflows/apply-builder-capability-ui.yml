name: Apply Builder Capability Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-builder-capability-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply capability-aware builder discovery
        run: python3 .github/scripts/apply_builder_capability_ui.py

      - name: Commit result and remove one-shot files
        run: |
          set -euo pipefail
          rm .github/workflows/apply-builder-capability-ui.yml
          rm .github/scripts/apply_builder_capability_ui.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: expose grantable builder capabilities"
          git push origin HEAD:main

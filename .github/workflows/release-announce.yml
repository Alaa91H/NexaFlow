name: Announce release on Telegram

# Publishing a GitHub release is the single event that fans out to the
# community: the announcement body is the published release body (the same
# changelog readers see on the release page) and the attachments are the
# release's own APKs. Keeping this out of the tag workflow means a Telegram
# outage can never fail a build whose binaries already shipped.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to re-announce (e.g. v3.91.16)"
        required: true
        type: string
      dry_run:
        description: "Render the messages without contacting Telegram"
        required: false
        default: false
        type: boolean

concurrency:
  group: telegram-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  announce:
    name: Post release to channel and community
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::Invalid release tag '$TAG'."
            exit 1
          }
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.prerelease' <<<"$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          # The exact published body, not a re-rendered summary: the Telegram
          # changelog is byte-for-byte the GitHub one.
          jq -r '.body // ""' <<<"$RELEASE_JSON" > release-notes.md
          test -s release-notes.md || { echo "::error::Release $TAG has an empty body."; exit 1; }

      - name: Download the release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.apk' --dir assets --clobber
          ls -l assets
          test -s "assets/NexaFlow-$TAG.apk"
          test -s "assets/NexaFlow-Wear-$TAG.apk"

      - name: Post to the channel and the community topic
        env:
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_CHAT_ID }}
          TELEGRAM_COMMUNITY_CHAT_ID: ${{ secrets.TELEGRAM_COMMUNITY_CHAT_ID }}
          TELEGRAM_COMMUNITY_TOPIC_ID: ${{ secrets.TELEGRAM_COMMUNITY_TOPIC_ID }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          [[ "$DRY_RUN" == "true" ]] && FLAGS+=(--dry-run)
          python3 scripts/publish_telegram_release.py \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md \
            --phone "assets/NexaFlow-$TAG.apk" \
            --wear "assets/NexaFlow-Wear-$TAG.apk" \
            "${FLAGS[@]}"

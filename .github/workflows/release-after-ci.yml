name: Release After Green Main

on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-after-green-main
  cancel-in-progress: false

jobs:
  tag-release-candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify successful run still matches latest main
        id: latest
        env:
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$CURRENT_SHA" != "$GREEN_SHA" ]]; then
            echo "Latest main moved after the successful CI run; skipping stale release candidate."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Resolve newest changelog version
        if: steps.latest.outputs.current == 'true'
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^## \[(v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)\].*/\1/p' CHANGELOG.md | head -n 1)"
          if [[ -z "$VERSION" ]]; then
            echo "No versioned CHANGELOG entry found; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Re-run tag/changelog hygiene before tagging
        if: steps.version.outputs.publish == 'true'
        run: python3 scripts/audit_catalog_and_releases.py tag-changelog "${{ steps.version.outputs.version }}"

      - name: Create release tag from verified main commit
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GREEN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" "$GREEN_SHA" -m "NexaFlow $VERSION"
          git push origin "refs/tags/$VERSION"
          echo "Created $VERSION at verified main commit $GREEN_SHA."

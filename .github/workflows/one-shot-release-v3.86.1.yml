name: One-shot v3.86.1 Release

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/release-request-v3.86.1"

permissions:
  contents: write
  actions: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-request-v3.86.1)"
          test "$VERSION" = "v3.86.1"
          grep -Fq "## [$VERSION] - 2026-09-23" CHANGELOG.md
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; continuing with release CI dispatch."
          fi

      - name: Create tag and seed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-request-v3.86.1)"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
          else
            gh release create "$VERSION" \
              --target "$GITHUB_SHA" \
              --title "NexaFlow $VERSION" \
              --notes "Release build in progress. Android CI will attach the signed phone and Wear OS APKs and replace these notes with the reviewed changelog."
          fi

      - name: Dispatch Android CI on release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < .github/release-request-v3.86.1)"
          gh workflow run android-ci.yml --ref "$VERSION"

      - name: Delete merged fix branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete fix/issue-3-wear-data-layer-package || {
            echo "::warning::Branch was already deleted or could not be removed."
          }

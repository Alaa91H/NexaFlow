name: One-shot v3.89.0 Release Launcher

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/release-request-v3.89.0"

permissions:
  contents: write
  actions: write

jobs:
  launch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release request
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-request-v3.89.0
          test "$VERSION" = "v3.89.0"
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$TARGET^{commit}"
          git merge-base --is-ancestor "$TARGET" HEAD
          git show "$TARGET:CHANGELOG.md" | grep -Fq "## [$VERSION] - 2026-09-25"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs"             -f ref="refs/tags/$VERSION"             -f sha="$TARGET"

      - name: Dispatch unified release pipeline on tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run nexaflow-ci.yml --ref "$VERSION"
          echo "Dispatched NexaFlow Unified CI for $VERSION"

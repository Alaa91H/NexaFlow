    - name: Diagnostics UI model (T30)
      run: python3 scripts/check_canonical_diagnostics_model.py
    - name: Test diagnostics model gate
      run: python3 -m unittest scripts.tests.test_check_canonical_diagnostics_model
    - name: Canonical plugin SDK (T31)
      run: python3 scripts/check_canonical_plugin_sdk.py
    - name: Test plugin SDK gate
      run: python3 -m unittest scripts.tests.test_check_canonical_plugin_sdk
    - name: Fault injection (T32)
      run: python3 scripts/check_canonical_fault_injection.py
    - name: Test fault injection gate
      run: python3 -m unittest scripts.tests.test_check_canonical_fault_injection
    - name: Performance budgets (T33)
      run: python3 scripts/check_canonical_performance_budget.py
    - name: Test performance budget gate

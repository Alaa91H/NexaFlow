      run: python3 scripts/check_canonical_plugin_conditions.py
    - name: Test plugin condition gate
      run: python3 -m unittest scripts.tests.test_check_canonical_plugin_conditions
    - name: Documentation closure (T42)
      run: python3 scripts/check_canonical_docs_closure.py
    - name: Test documentation closure gate
      run: python3 -m unittest scripts.tests.test_check_canonical_docs_closure
    - name: Measured performance regression (T43)
      run: python3 scripts/check_canonical_perf_regression.py
    - name: Test performance regression gate
      run: python3 -m unittest scripts.tests.test_check_canonical_perf_regression
    - name: Release closure (T44)
      run: python3 scripts/check_canonical_release_closure.py
    - name: Test release closure gate
      run: python3 -m unittest scripts.tests.test_check_canonical_release_closure
    - name: Runtime configuration contract audit
      run: python3 scripts/check_node_contracts.py
    - name: Tag hygiene (tag ↔ changelog entry) on version tags
      if: startsWith(github.ref, 'refs/tags/')
      run: python3 scripts/audit_catalog_and_releases.py tag-changelog "${{ github.ref_name }}"
    - name: Unit-test the resource gate (orphan drawable/layout/dimen)
      run: python3 scripts/tests/test_check_resources.py
    - name: Install pytest for the resource-gate suite
      run: python3 -m pip install --quiet pytest
    - name: pytest the resource gate (orphans, lint report, pins guard, auto-fix)
      run: >-
        python3 -m pytest
        scripts/tests/test_check_resources_pytest.py
        scripts/tests/test_check_lint_config.py
        scripts/tests/test_auto_fix.py
        -q
    - name: Test exported component security gate
      run: python3 -m unittest discover -s scripts/tests -p test_exported_components.py
    - name: README fact and suppression-budget guardrails
      run: |
        python3 -m unittest discover -s scripts/tests -p 'test_readme_stale_counts.py'
        python3 scripts/check_readme_stale_counts.py
        python3 -m unittest discover -s scripts/tests -p 'test_suppression_budget.py'
        python3 scripts/check_suppression_budget.py
    - name: Run Detekt static analysis
      run: ./gradlew detekt
    - name: Run Android Lint
      run: ./gradlew lintDebug
    - name: Unified resource gate (banned + orphans + lint UnusedResources)
      if: always()
      run: python3 scripts/check_resources.py
    - name: Module boundaries
      run: |
        python3 -m unittest scripts.tests.test_module_boundaries
        python3 scripts/check_module_boundaries.py
    - name: Compose stability budget
      run: |
        python3 -m unittest scripts.tests.test_compose_stability
        python3 scripts/check_compose_stability.py
    - name: Docs freshness gate (stale active audits fail)
      run: python3 scripts/check_docs_freshness.py --max-commits 25
    - name: Upload Lint Report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: lint-report
        if-no-files-found: ignore
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
          **/build/reports/lint-results-debug.*

  supply-chain:
    name: Supply chain (SBOM + CVE)
    needs: lint
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Set up Android SDK command-line tools
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Test supply-chain gates
      run: python3 -m unittest scripts.tests.test_supply_chain
    - name: Resolve the shipped release runtime inventory
      run: >-
        ./gradlew :app:releaseDependencyInventory --no-configuration-cache
        --no-daemon --console=plain
    - name: Generate CycloneDX SBOM for shipped components
      run: >-
        python3 scripts/generate_sbom.py
        --inventory app/build/reports/dependency-inventory/release-runtime.json
        --output build/reports/sbom/nexaflow-sbom.cdx.json
    - name: Scan dependencies for known vulnerabilities
      run: |
        python3 scripts/check_dependency_vulnerabilities.py \
          --sbom build/reports/sbom/nexaflow-sbom.cdx.json \
          --allowlist config/osv-allowlist.json \
          --fail-on HIGH,CRITICAL \
          --report build/reports/sbom/vulnerabilities.json
    - name: Upload SBOM and vulnerability report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: nexaflow-sbom
        if-no-files-found: error
        path: |
          build/reports/sbom/nexaflow-sbom.cdx.json
          build/reports/sbom/vulnerabilities.json

  coverage:
    needs: lint
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up JDK 21 for unit-test toolchain
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Enforce configured coverage policy
      run: ./gradlew coverageGate --continue --no-configuration-cache --no-parallel --max-workers=2 --no-daemon --stacktrace --console=plain
    - name: Enforce diff coverage on changed production lines
      if: always() && github.event_name == 'pull_request'
      run: >-
        python3 scripts/check_diff_coverage.py
        --base "${{ github.event.pull_request.base.sha }}"
        --threshold 0.80
    - name: Test diff-coverage gate
      if: always()
      run: python3 -m unittest scripts.tests.test_diff_coverage
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage-reports
        if-no-files-found: ignore
        path: |
          **/build/coverage/report.xml
          **/build/coverage/html/**

  windows-compat:
    name: Windows compatibility (datastore + database)
    needs: lint
    # NFA-14: the two storage modules failed on Windows before (CRLF/case
    # sensitive paths); running them on the same commit keeps "works on my
    # machine" from returning without a full second build matrix.
    if: github.event_name != 'pull_request_target'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up JDK 21 for unit-test toolchain
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Run the critical storage suites on Windows
      shell: bash
      run: >-
        ./gradlew :core:datastore:testDebugUnitTest :core:database:testDebugUnitTest
        --no-configuration-cache --no-daemon --stacktrace --console=plain
    - name: Upload Windows test reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: windows-compat-reports
        if-no-files-found: ignore
        path: |
          core/datastore/build/reports/tests/**
          core/database/build/reports/tests/**

  android-smoke:
    name: Android smoke (API 37, PR gate)
    needs: lint
    # NFA-02: a PR cannot merge unless the @Smoke subset passes on a real
    # emulator. The nightly matrix below runs the full suite on four API levels.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/android-instrumentation.yml
    with:
      api-level: 37
      system-image: system-images;android-37.0;google_apis;x86_64
      test-filter: smoke

  android-nightly:
    name: Android nightly API ${{ matrix.api-level }}
    needs: lint
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            system-image: system-images;android-26;google_apis;x86
          - api-level: 33
            system-image: system-images;android-33;google_apis;x86_64
          - api-level: 36
            system-image: system-images;android-36;google_apis;x86_64
          - api-level: 37
            system-image: system-images;android-37.0;google_apis;x86_64
    uses: ./.github/workflows/android-instrumentation.yml
    with:
      api-level: ${{ matrix.api-level }}
      system-image: ${{ matrix.system-image }}
      test-filter: full

  build:
    needs: lint
    if: github.event_name != 'pull_request_target'
    # Keep lint and packaging on the same reviewed runner baseline.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # GitVersion derives versionCode from the nearest v* tag; without the
        # tag history a main-branch build falls back to 0.0.1 (versionCode 1),
        # producing APKs that can never upgrade a real install.
        fetch-depth: 0
        fetch-tags: true
    - name: Validate release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        TAG="$GITHUB_REF_NAME"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
          echo "::error::Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix."
          exit 1
        fi
        EXACT_TAG="$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)"
        test "$EXACT_TAG" = "$TAG" || { echo "::error::Checked-out commit does not resolve exactly to release tag $TAG."; exit 1; }
        git fetch origin main --no-tags
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release tags must point to a commit contained in main."; exit 1; }
    - name: set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up JDK 21 for unit-test toolchain
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Verify the current Room schema snapshot
      run: |
        ./gradlew :core:database:kspDebugKotlin --no-configuration-cache --no-daemon --console=plain
        ROOM_VERSION="$(sed -n 's/^[[:space:]]*version = \([0-9][0-9]*\),/\1/p' core/database/src/main/java/com/nexaflow/core/database/AppDatabase.kt | head -1)"
        test -n "$ROOM_VERSION" || { echo "Could not read the Room database version." >&2; exit 1; }
        ROOM_SCHEMA="core/database/schemas/com.nexaflow.core.database.AppDatabase/${ROOM_VERSION}.json"
        test -s "$ROOM_SCHEMA" || { echo "Room schema snapshot missing: $ROOM_SCHEMA" >&2; exit 1; }
        git diff --exit-code -- core/database/schemas
        echo "Room schema $ROOM_VERSION is generated and committed."
    - name: Run unit tests
      run: ./gradlew :core:datastore:testDebugUnitTest testDebugUnitTest --no-daemon --stacktrace --console=plain
    - name: Restore release signing keystore (when configured)
      env:
        KEYSTORE_B64: ${{ secrets.NEXAFLOW_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/nexaflow-release.jks
          echo "Release keystore restored."
          # Export an all-or-nothing signing configuration for later steps. A
          # partial configuration must never turn an ordinary main build into
          # an invalid release build; tags are rejected explicitly below.
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            {
              echo "NEXAFLOW_KEYSTORE_FILE=keystore/nexaflow-release.jks"
              echo "NEXAFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NEXAFLOW_KEY_ALIAS=$KEY_ALIAS"
              echo "NEXAFLOW_KEY_PASSWORD=$KEY_PASSWORD"
              echo "NEXAFLOW_SIGNING_CONFIGURED=true"
            } >> "$GITHUB_ENV"
          else
            echo "Release keystore credentials are incomplete; signing variables were not exported."
          fi
        else
          echo "No keystore secret configured - local/ad-hoc release builds use debug signing only."
        fi
        # The build reads NEXAFLOW_* env vars over keystore.properties.
    - name: Require production signing for version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_FILE: keystore/nexaflow-release.jks
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        NEXAFLOW_KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        test -s "$NEXAFLOW_KEYSTORE_FILE" || { echo "Version tags require NEXAFLOW_KEYSTORE_BASE64." >&2; exit 1; }
        test -n "$NEXAFLOW_KEYSTORE_PASSWORD" || { echo "Version tags require NEXAFLOW_KEYSTORE_PASSWORD." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_ALIAS" || { echo "Version tags require NEXAFLOW_KEY_ALIAS." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_PASSWORD" || { echo "Version tags require NEXAFLOW_KEY_PASSWORD." >&2; exit 1; }
    - name: Build untagged APKs with explicit debug signing opt-in
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        # Google Maps API key for the embedded map picker; baked into every
        # distributed APK so the map works for all users, not just local builds.
        NEXAFLOW_MAPS_API_KEY: ${{ secrets.NEXAFLOW_MAPS_API_KEY }}
      run: ./gradlew assembleDebug assembleRelease -PallowDebugSigning=true
    - name: Build production-signed tag APKs
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_MAPS_API_KEY: ${{ secrets.NEXAFLOW_MAPS_API_KEY }}
      run: ./gradlew assembleDebug assembleRelease
    - name: Verify R8 mapping was produced
      run: test -s app/build/outputs/mapping/release/mapping.txt
    - name: Upload R8 mapping for the release (deobfuscates field crashes)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: nexaflow-release-mapping
        if-no-files-found: error
        path: app/build/outputs/mapping/release/mapping.txt
    - name: Verify packaged version matches release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/release/app-release.apk
        AAPT="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort -V | tail -1)"
        ACTUAL_VERSION="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
        test "$ACTUAL_VERSION" = "$GITHUB_REF_NAME" || {
          echo "::error::Packaged versionName '$ACTUAL_VERSION' does not match release tag '$GITHUB_REF_NAME'."
          exit 1
        }
        WATCH_APK=wear/build/outputs/apk/release/wear-release.apk
        WATCH_VERSION="$("$AAPT" dump badging "$WATCH_APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
        test "$WATCH_VERSION" = "$GITHUB_REF_NAME" || {
          echo "::error::Packaged Wear versionName '$WATCH_VERSION' does not match release tag '$GITHUB_REF_NAME'."
          exit 1
        }
        echo "Phone and Wear package versions verified: $ACTUAL_VERSION"
    - name: Verify phone/Wear Data Layer identity contract
      run: |
        PHONE_APK=app/build/outputs/apk/release/app-release.apk
        WATCH_APK=wear/build/outputs/apk/release/wear-release.apk
        test -s "$PHONE_APK" || { echo "Phone release APK missing: $PHONE_APK" >&2; exit 1; }
        test -s "$WATCH_APK" || { echo "Watch release APK missing: $WATCH_APK" >&2; exit 1; }

        AAPT="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort -V | tail -1)"
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"

        PHONE_PACKAGE="$("$AAPT" dump badging "$PHONE_APK" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -1)"
        WATCH_PACKAGE="$("$AAPT" dump badging "$WATCH_APK" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -1)"
        test -n "$PHONE_PACKAGE" || { echo "Could not read phone applicationId." >&2; exit 1; }
        test -n "$WATCH_PACKAGE" || { echo "Could not read Wear applicationId." >&2; exit 1; }
        test "$PHONE_PACKAGE" = "$WATCH_PACKAGE" || {
          echo "Wear Data Layer package mismatch: phone=$PHONE_PACKAGE watch=$WATCH_PACKAGE" >&2
          exit 1
        }
        test "$PHONE_PACKAGE" = "com.nexaflow.app" || {
          echo "Unexpected NexaFlow Data Layer package: $PHONE_PACKAGE" >&2
          exit 1
        }

        PHONE_CERT="$("$APKSIGNER" verify --print-certs "$PHONE_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        WATCH_CERT="$("$APKSIGNER" verify --print-certs "$WATCH_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$PHONE_CERT" || { echo "Could not read phone signing certificate." >&2; exit 1; }
        test -n "$WATCH_CERT" || { echo "Could not read Wear signing certificate." >&2; exit 1; }
        test "$PHONE_CERT" = "$WATCH_CERT" || {
          echo "Wear Data Layer certificate mismatch between phone and watch APKs." >&2
          exit 1
        }

        "$APKSIGNER" verify --verbose "$WATCH_APK" | grep -E "Verified using v(2|3) scheme.*: true"
        echo "Wear Data Layer contract OK: package=$PHONE_PACKAGE certificate=$PHONE_CERT"
    - name: Audit merged release exported components
      run: python3 scripts/audit_exported_components.py --merged app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
    - name: Verify release APK signing certificate
      if: env.NEXAFLOW_SIGNING_CONFIGURED == 'true'
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        echo "=== Release APK signing certificate ==="
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
          | grep -E "Signer|CN=|SHA-256" || true
        echo ""
        echo "Compare the SHA-256 above with the expected certificate."
        echo "If they differ, the CI secrets contain a different keystore than local builds."
    - name: Verify packaged phone-state permission manifest
      run: python3 scripts/check_apk_phone_permission.py app/build/outputs/apk/release/app-release.apk
    - name: Verify dependency verification metadata is up to date
      run: |
        cp gradle/verification-metadata.xml /tmp/verification-metadata.expected.xml
        ./gradlew --write-verification-metadata sha256 :app:assembleDebug --console=plain
        python3 scripts/check_verification_metadata.py \
          /tmp/verification-metadata.expected.xml gradle/verification-metadata.xml
    - name: Verify 16 KB page-size alignment of native libraries
      run: python3 scripts/check_16kb.py app/build/outputs/apk/release/app-release.apk
    - name: Verify APK signature (v1/v2/v3)
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        echo "== APK signature verification (verbose) =="
        "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        # Gate: at least one modern signature scheme (v2 or v3) must verify.
        "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk \
          | grep -E "Verified using v(2|3) scheme.*: true"
    - name: Verify production certificate matches keystore on version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        EXPECTED="$(keytool -list -v -keystore keystore/nexaflow-release.jks -storepass "$NEXAFLOW_KEYSTORE_PASSWORD" -alias "$NEXAFLOW_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$EXPECTED" || { echo "Could not read the release-keystore certificate fingerprint." >&2; exit 1; }
        test -n "$ACTUAL" || { echo "Could not read the APK certificate fingerprint." >&2; exit 1; }
        test "$EXPECTED" = "$ACTUAL" || { echo "APK certificate does not match the production keystore." >&2; exit 1; }
        echo "APK certificate matches the configured production keystore."
    - name: Verify zipalign (4 KB + 16 KB native page alignment)
      run: |
        ZIPALIGN="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | sort -V | tail -1)"
        "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
    - name: Verify watch APK signature and certificate on version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
      run: |
        WATCH_APK=wear/build/outputs/apk/release/wear-release.apk
        test -s "$WATCH_APK" || { echo "Watch release APK missing: $WATCH_APK" >&2; exit 1; }
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        "$APKSIGNER" verify --verbose "$WATCH_APK" | grep -E "Verified using v(2|3) scheme.*: true"
        EXPECTED="$(keytool -list -v -keystore keystore/nexaflow-release.jks -storepass "$NEXAFLOW_KEYSTORE_PASSWORD" -alias "$NEXAFLOW_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        ACTUAL="$("$APKSIGNER" verify --print-certs "$WATCH_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$EXPECTED" || { echo "Could not read the release-keystore certificate fingerprint." >&2; exit 1; }
        test -n "$ACTUAL" || { echo "Could not read the watch APK certificate fingerprint." >&2; exit 1; }
        test "$EXPECTED" = "$ACTUAL" || { echo "Watch APK certificate does not match the production keystore." >&2; exit 1; }
        echo "Watch APK certificate matches the production keystore."
    - name: Audit native libraries (ABI + size)
      run: python3 scripts/check_apk_libs.py app/build/outputs/apk/release/app-release.apk
    - name: Upload Release APK
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: nexaflow-release-apk
        if-no-files-found: error
        path: app/build/outputs/apk/release/app-release.apk
    - name: Upload Watch Release APK
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: nexaflow-wear-release-apk
        if-no-files-found: error
        path: wear/build/outputs/apk/release/wear-release.apk
  release:
    name: Publish tagged release
    needs: [lint, coverage, build, supply-chain]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: nexaflow-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::Invalid release tag '$TAG'."
            exit 1
          }
          python3 scripts/audit_catalog_and_releases.py tag-changelog "$TAG"

      - name: Download phone APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nexaflow-release-apk
          path: release-assets/phone

      - name: Download Wear OS APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nexaflow-wear-release-apk
          path: release-assets/wear

      - name: Download R8 mapping
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nexaflow-release-mapping
          path: release-assets/mapping

      - name: Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: nexaflow-sbom
          path: release-assets/sbom

      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          MAPPING="NexaFlow-$TAG-mapping.txt"
          SBOM="NexaFlow-$TAG-sbom.cdx.json"
          cp release-assets/phone/app-release.apk "$PHONE"
          cp release-assets/wear/wear-release.apk "$WEAR"
          cp release-assets/mapping/mapping.txt "$MAPPING"
          cp release-assets/sbom/nexaflow-sbom.cdx.json "$SBOM"
          # Unreadable release crashes are the cost of a missing mapping file;
          # an empty SBOM defeats the CVE response plan. Neither may ship empty.
          test -s "$PHONE"
          test -s "$WEAR"
          test -s "$MAPPING"
          test -s "$SBOM"
          python3 scripts/generate_release_notes.py "$TAG" > release-notes.md
          # Publish verifiable fingerprints next to the binaries (NFA-08/4.4).
          sha256sum "$PHONE" "$WEAR" "$MAPPING" "$SBOM" > "NexaFlow-$TAG-SHA256SUMS.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          MAPPING="NexaFlow-$TAG-mapping.txt"
          SBOM="NexaFlow-$TAG-sbom.cdx.json"
          SUMS="NexaFlow-$TAG-SHA256SUMS.txt"
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PHONE" "$WEAR" "$MAPPING" "$SBOM" "$SUMS" --clobber
            gh release edit "$TAG" --title "NexaFlow $TAG" --notes-file release-notes.md "${PRERELEASE[@]}"
          else
            gh release create "$TAG" "$PHONE" "$WEAR" "$MAPPING" "$SBOM" "$SUMS" \
              --verify-tag \
              --title "NexaFlow $TAG" \
              --notes-file release-notes.md \
              "${PRERELEASE[@]}"
          fi

          # Keep reruns of an existing tag as clean as a newly created release:
          # only the versioned APKs, mapping file, and SBOM remain attached.
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .id)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate \
            | jq -r --arg phone "$PHONE" --arg wear "$WEAR" \
                --arg mapping "$MAPPING" --arg sbom "$SBOM" --arg sums "$SUMS" \
                '.[] | select([$phone, $wear, $mapping, $sbom, $sums] | index(.name) | not) | .id' \
            | while read -r ASSET_ID; do
                test -n "$ASSET_ID" && gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
              done

      - name: Attest release artifacts (SLSA provenance)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            NexaFlow-${{ github.ref_name }}.apk
            NexaFlow-Wear-${{ github.ref_name }}.apk
            NexaFlow-${{ github.ref_name }}-mapping.txt
            NexaFlow-${{ github.ref_name }}-sbom.cdx.json

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          MAPPING="NexaFlow-$TAG-mapping.txt"
          SBOM="NexaFlow-$TAG-sbom.cdx.json"
          SUMS="NexaFlow-$TAG-SHA256SUMS.txt"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          MISSING="$(jq \
            --arg phone "$PHONE" --arg wear "$WEAR" --arg mapping "$MAPPING" --arg sbom "$SBOM" --arg sums "$SUMS" \
            '[$phone, $wear, $mapping, $sbom, $sums] - [.assets[].name] | length' \
            <<<"$RELEASE_JSON")"
          test "$MISSING" = "0" || {
            echo "::error::Release is missing one of: APKs, R8 mapping, or SBOM."
            exit 1
          }
          EXTRA="$(jq \
            --arg phone "$PHONE" --arg wear "$WEAR" --arg mapping "$MAPPING" --arg sbom "$SBOM" --arg sums "$SUMS" \
            '[.assets[].name | select(. != $phone and . != $wear and . != $mapping and . != $sbom and . != $sums)] | length' \
            <<<"$RELEASE_JSON")"
          test "$EXTRA" = "0" || { echo "::error::Release contains unexpected non-versioned assets."; exit 1; }
          for ASSET in "$PHONE" "$WEAR" "$MAPPING" "$SBOM" "$SUMS"; do
            SIZE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .size' <<<"$RELEASE_JSON")"
            STATE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .state' <<<"$RELEASE_JSON")"
            test -n "$SIZE" && test "$SIZE" -gt 0
            test "$STATE" = "uploaded"
          done
          echo "::notice::Release $TAG published and verified (APKs + R8 mapping + SBOM + SHA-256 sums)."

  # Branch integration is intentionally PR-only. The former consolidate job
  # merged every remote branch into main with incoming-branch conflict wins and
  # then deleted all branches. That made an arbitrary stale or experimental
  # branch capable of entering main without focused review. Keep integration at
  # the pull-request boundary where the normal lint/build gates apply.

  merge-dependabot-update:
    permissions:
      contents: write
      pull-requests: write
    # Do not check out or execute code from the pull request. This workflow
    # only asks GitHub to watch its required checks and merge the PR after they
    # pass, so it retains pull_request_target permissions safely.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    steps:
      - name: Wait for all pull-request checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --watch --fail-fast
      - name: Enable squash auto-merge after verified checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch

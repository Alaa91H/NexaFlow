    - name: Test legacy canonical adapter gate
      run: python3 -m unittest scripts.tests.test_check_canonical_legacy_adapter
    - name: Legacy mappings coverage 237/237 (T15 / Gates B+E)
      run: python3 scripts/check_canonical_legacy_mappings.py
    - name: Test legacy mappings gate
      run: python3 -m unittest scripts.tests.test_check_canonical_legacy_mappings
    - name: Golden migration suite (T16 / Gate E)
      run: python3 scripts/check_canonical_golden_migration.py
    - name: Test golden migration gate
      run: python3 -m unittest scripts.tests.test_check_canonical_golden_migration
    - name: Pilot Open Settings family (T17)
      run: python3 scripts/check_canonical_pilot_open_family.py
    - name: Test pilot open family gate
      run: python3 -m unittest scripts.tests.test_check_canonical_pilot_open_family
    - name: Media & Navigation family (T18)

    - name: Test media navigation family gate
      run: python3 -m unittest scripts.tests.test_check_canonical_family_media_navigation
    - name: Connectivity family (T19)
      run: python3 scripts/check_canonical_family_connectivity.py
    - name: Test connectivity family gate
      run: python3 -m unittest scripts.tests.test_check_canonical_family_connectivity
    - name: Display & Sound family (T20)
      run: python3 scripts/check_canonical_family_display_sound.py
    - name: Test display sound family gate
      run: python3 -m unittest scripts.tests.test_check_canonical_family_display_sound
    - name: Applications family (T21)
      run: python3 scripts/check_canonical_family_applications.py
    - name: Test applications family gate

            --notes "Release build in progress. The Android CI tag workflow will attach the signed phone and Wear OS APKs and replace these notes with the reviewed changelog."

  repair-release-v3-87-0:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.repair_release_387 == 'true'
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download signed release APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 35894958963 -n nexaflow-release-apk -D /tmp/nexaflow-phone
          gh run download 35894958963 -n nexaflow-wear-release-apk -D /tmp/nexaflow-wear

          PHONE_APK="$(find /tmp/nexaflow-phone -type f -name '*.apk' -print -quit)"
          WEAR_APK="$(find /tmp/nexaflow-wear -type f -name '*.apk' -print -quit)"
          test -n "$PHONE_APK"
          test -n "$WEAR_APK"

          cp "$PHONE_APK" NexaFlow-v3.87.0.apk
          cp "$WEAR_APK" NexaFlow-Wear-v3.87.0.apk

      - name: Replace release assets with versioned filenames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v3.87.0

          gh release delete-asset "$TAG" "app-release.apk" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$TAG" "wear-release.apk" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$TAG" "NexaFlow-v3.87.0.apk" --yes >/dev/null 2>&1 || true
          gh release delete-asset "$TAG" "NexaFlow-Wear-v3.87.0.apk" --yes >/dev/null 2>&1 || true

          gh release upload "$TAG" NexaFlow-v3.87.0.apk NexaFlow-Wear-v3.87.0.apk --clobber

          MISSING="$(gh release view "$TAG" --json assets --jq '["NexaFlow-v3.87.0.apk","NexaFlow-Wear-v3.87.0.apk"] - [.assets[].name] | length')"
          test "$MISSING" = "0"
          echo "Release assets repaired successfully."

  verify-release-v3-88-0:
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.verify_release_388 == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify published release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v3.88.0
          PHONE="NexaFlow-v3.88.0.apk"
          WEAR="NexaFlow-Wear-v3.88.0.apk"

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"

          MISSING="$(jq --arg phone "$PHONE" --arg wear "$WEAR"             '[$phone, $wear] - [.assets[].name] | length' <<<"$RELEASE_JSON")"
          test "$MISSING" = "0"

          for ASSET in "$PHONE" "$WEAR"; do
            SIZE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .size' <<<"$RELEASE_JSON")"
            STATE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .state' <<<"$RELEASE_JSON")"
            DIGEST="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .digest // empty' <<<"$RELEASE_JSON")"
            test -n "$SIZE" && test "$SIZE" -gt 0
            test "$STATE" = "uploaded"
            test -n "$DIGEST"
          done

          BODY="$(jq -r '.body // ""' <<<"$RELEASE_JSON")"
          grep -Fq "### Added — Wear OS automation foundation" <<<"$BODY"
          grep -Fq "### Fixed" <<<"$BODY"
          ! grep -Fq "Release build in progress" <<<"$BODY"

          echo "Release $TAG is complete: notes and both signed APK assets are present."

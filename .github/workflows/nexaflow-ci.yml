name: NexaFlow Unified CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v[0-9]*" ]
  pull_request:
    branches: [ "main" ]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '0 6 * * *'

permissions: {}

# Concurrency belongs to the whole workflow, not individual jobs. With
# per-job concurrency an older run can finish lint later, start its build, and
# cancel the build of a newer commit. The newest run for the same event/ref now
# owns the complete lint -> test -> build chain.
concurrency:
  group: nexaflow-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request_target'
    permissions:
      contents: read
    # Exercise the newest GitHub-hosted Ubuntu LTS image explicitly.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up JDK 21 for unit-test toolchain
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Auto-fix resource hygiene (orphans, duplicates, balance)
      # --check: the tree must already be auto-fix-clean. If this fails, run
      # `python3 scripts/auto_fix.py` locally and commit the result.
      run: python3 scripts/auto_fix.py --check
    - name: Verify string parity across all locales
      run: python3 scripts/check_strings_parity.py
    - name: Translation completeness gate (micro-audit)
      # Every locale value must be a real translation: flags untranslated
      # English copies, foreign-script leakage, placeholder mismatches and
      # empty values across all modules and locales.
      run: |
        python3 scripts/audit_translation_completeness.py --self-test
        python3 scripts/audit_translation_completeness.py
    - name: Hardcoded-text gate (no Arabic script in shipped Kotlin/Java)
      # Keeps issue #4 (Arabic strings hardcoded in the builder UI) from ever
      # shipping again; legitimate occurrences live in the reviewed ALLOWLIST.
      run: python3 scripts/check_hardcoded_text.py --self-test
    - name: Vendor-neutrality gate (no commercial ROM/device names outside protocol files)
      # The engine reasons about neutral capability tiers (RomFamily), never
      # products; detection evidence stays in the protocol allowlist only.
      run: python3 scripts/check_vendor_neutrality.py --self-test && python3 scripts/check_vendor_neutrality.py
    - name: Test the hardcoded-text gate
      run: python3 -m unittest discover -s scripts/tests -p test_check_hardcoded_text.py
    - name: Catalog parity (trigger/action enum ↔ builder picker)
      run: python3 scripts/audit_catalog_and_releases.py catalog
    - name: Tag hygiene (tag ↔ changelog entry) on version tags
      if: startsWith(github.ref, 'refs/tags/')
      run: python3 scripts/audit_catalog_and_releases.py tag-changelog "${{ github.ref_name }}"
    - name: Unit-test the resource gate (orphan drawable/layout/dimen)
      run: python3 scripts/tests/test_check_resources.py
    - name: Install pytest for the resource-gate suite
      run: python3 -m pip install --quiet pytest
    - name: pytest the resource gate (orphans, lint report, pins guard, auto-fix)
      run: >-
        python3 -m pytest
        scripts/tests/test_check_resources_pytest.py
        scripts/tests/test_check_lint_config.py
        scripts/tests/test_auto_fix.py
        -q
    - name: Test exported component security gate
      run: python3 -m unittest discover -s scripts/tests -p test_exported_components.py
    - name: Run Detekt static analysis
      run: ./gradlew detekt
    - name: Run Android Lint
      run: ./gradlew lintDebug
    - name: Unified resource gate (banned + orphans + lint UnusedResources)
      if: always()
      run: python3 scripts/check_resources.py
    - name: Upload Lint Report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: lint-report
        path: |
          app/build/reports/lint-results-debug.html
          app/build/reports/lint-results-debug.xml
          **/build/reports/lint-results-debug.*

  android-integration:
    name: Android emulator integration
    needs: lint
    # Connected Android tests are intentionally a scheduled/manual evidence
    # lane first. They do not consume PR capacity until the emulator suite has
    # demonstrated stable signal across repeated runs.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant Gradle execute permission
      run: chmod +x gradlew
    - name: Provision Android 15 emulator
      shell: bash
      run: |
        set -euo pipefail
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
        fi
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager           "platform-tools"           "emulator"           "system-images;android-35;google_apis;x86_64"
        echo "no" | avdmanager create avd           --force           --name nexaflow-ci-api35           --package "system-images;android-35;google_apis;x86_64"           --device "pixel_6"
    - name: Boot emulator
      shell: bash
      run: |
        set -euo pipefail
        nohup emulator           -avd nexaflow-ci-api35           -no-window           -noaudio           -no-boot-anim           -no-snapshot           -gpu swiftshader_indirect           -camera-back none           -camera-front none           > "$RUNNER_TEMP/nexaflow-emulator.log" 2>&1 &
        adb wait-for-device
        deadline=$((SECONDS + 300))
        until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "::error::Android emulator did not finish booting within 5 minutes."
            cat "$RUNNER_TEMP/nexaflow-emulator.log" || true
            exit 1
          fi
          sleep 2
        done
        adb shell input keyevent 82 || true
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
        adb shell getprop ro.build.version.sdk
    - name: Run connected app instrumentation tests
      run: ./gradlew :app:connectedDebugAndroidTest --no-parallel --max-workers=2 --console=plain
    - name: Capture emulator diagnostics
      if: always()
      shell: bash
      run: |
        adb logcat -d > android-integration-logcat.txt 2>/dev/null || true
        adb shell getprop > android-integration-properties.txt 2>/dev/null || true
        cp "$RUNNER_TEMP/nexaflow-emulator.log" android-emulator.log 2>/dev/null || true
    - name: Upload Android integration evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: android-integration-evidence-api35
        if-no-files-found: warn
        path: |
          app/build/outputs/androidTest-results/**
          app/build/reports/androidTests/**
          android-integration-logcat.txt
          android-integration-properties.txt
          android-emulator.log

  build:
    needs: lint
    if: github.event_name != 'pull_request_target'
    # Keep lint and packaging on the same reviewed runner baseline.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        # GitVersion derives versionCode from the nearest v* tag; without the
        # tag history a main-branch build falls back to 0.0.1 (versionCode 1),
        # producing APKs that can never upgrade a real install.
        fetch-depth: 0
        fetch-tags: true
    - name: Validate release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        TAG="$GITHUB_REF_NAME"
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
          echo "::error::Invalid release tag '$TAG'. Expected vMAJOR.MINOR.PATCH with an optional prerelease suffix."
          exit 1
        fi
        EXACT_TAG="$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)"
        test "$EXACT_TAG" = "$TAG" || { echo "::error::Checked-out commit does not resolve exactly to release tag $TAG."; exit 1; }
        git fetch origin main --no-tags
        git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::Release tags must point to a commit contained in main."; exit 1; }
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up JDK 21 for unit-test toolchain
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
    - name: Restore release signing keystore (when configured)
      env:
        KEYSTORE_B64: ${{ secrets.NEXAFLOW_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/nexaflow-release.jks
          echo "Release keystore restored."
          # Export an all-or-nothing signing configuration for later steps. A
          # partial configuration must never turn an ordinary main build into
          # an invalid release build; tags are rejected explicitly below.
          if [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            {
              echo "NEXAFLOW_KEYSTORE_FILE=keystore/nexaflow-release.jks"
              echo "NEXAFLOW_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NEXAFLOW_KEY_ALIAS=$KEY_ALIAS"
              echo "NEXAFLOW_KEY_PASSWORD=$KEY_PASSWORD"
              echo "NEXAFLOW_SIGNING_CONFIGURED=true"
            } >> "$GITHUB_ENV"
          else
            echo "Release keystore credentials are incomplete; signing variables were not exported."
          fi
        else
          echo "No keystore secret configured - local/ad-hoc release builds use debug signing only."
        fi
        # The build reads NEXAFLOW_* env vars over keystore.properties.
    - name: Require production signing for version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_FILE: keystore/nexaflow-release.jks
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
        NEXAFLOW_KEY_PASSWORD: ${{ secrets.NEXAFLOW_KEY_PASSWORD }}
      run: |
        test -s "$NEXAFLOW_KEYSTORE_FILE" || { echo "Version tags require NEXAFLOW_KEYSTORE_BASE64." >&2; exit 1; }
        test -n "$NEXAFLOW_KEYSTORE_PASSWORD" || { echo "Version tags require NEXAFLOW_KEYSTORE_PASSWORD." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_ALIAS" || { echo "Version tags require NEXAFLOW_KEY_ALIAS." >&2; exit 1; }
        test -n "$NEXAFLOW_KEY_PASSWORD" || { echo "Version tags require NEXAFLOW_KEY_PASSWORD." >&2; exit 1; }
    - name: Build with Gradle
      env:
        # Google Maps API key for the embedded map picker; baked into every
        # distributed APK so the map works for all users, not just local builds.
        NEXAFLOW_MAPS_API_KEY: ${{ secrets.NEXAFLOW_MAPS_API_KEY }}
      run: ./gradlew assembleDebug assembleRelease
    - name: Verify packaged version matches release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        APK=app/build/outputs/apk/release/app-release.apk
        AAPT="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort -V | tail -1)"
        ACTUAL_VERSION="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
        test "$ACTUAL_VERSION" = "$GITHUB_REF_NAME" || {
          echo "::error::Packaged versionName '$ACTUAL_VERSION' does not match release tag '$GITHUB_REF_NAME'."
          exit 1
        }
        echo "Package version verified: $ACTUAL_VERSION"
    - name: Verify phone/Wear Data Layer identity contract
      run: |
        PHONE_APK=app/build/outputs/apk/release/app-release.apk
        WATCH_APK=wear/build/outputs/apk/release/wear-release.apk
        test -s "$PHONE_APK" || { echo "Phone release APK missing: $PHONE_APK" >&2; exit 1; }
        test -s "$WATCH_APK" || { echo "Watch release APK missing: $WATCH_APK" >&2; exit 1; }

        AAPT="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort -V | tail -1)"
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"

        PHONE_PACKAGE="$("$AAPT" dump badging "$PHONE_APK" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -1)"
        WATCH_PACKAGE="$("$AAPT" dump badging "$WATCH_APK" | sed -n "s/^package: name='\([^\']*\)'.*/\1/p" | head -1)"
        test -n "$PHONE_PACKAGE" || { echo "Could not read phone applicationId." >&2; exit 1; }
        test -n "$WATCH_PACKAGE" || { echo "Could not read Wear applicationId." >&2; exit 1; }
        test "$PHONE_PACKAGE" = "$WATCH_PACKAGE" || {
          echo "Wear Data Layer package mismatch: phone=$PHONE_PACKAGE watch=$WATCH_PACKAGE" >&2
          exit 1
        }
        test "$PHONE_PACKAGE" = "com.nexaflow.app" || {
          echo "Unexpected NexaFlow Data Layer package: $PHONE_PACKAGE" >&2
          exit 1
        }

        PHONE_CERT="$("$APKSIGNER" verify --print-certs "$PHONE_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        WATCH_CERT="$("$APKSIGNER" verify --print-certs "$WATCH_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$PHONE_CERT" || { echo "Could not read phone signing certificate." >&2; exit 1; }
        test -n "$WATCH_CERT" || { echo "Could not read Wear signing certificate." >&2; exit 1; }
        test "$PHONE_CERT" = "$WATCH_CERT" || {
          echo "Wear Data Layer certificate mismatch between phone and watch APKs." >&2
          exit 1
        }

        "$APKSIGNER" verify --verbose "$WATCH_APK" | grep -E "Verified using v(2|3) scheme.*: true"
        echo "Wear Data Layer contract OK: package=$PHONE_PACKAGE certificate=$PHONE_CERT"
    - name: Audit merged release exported components
      run: python3 scripts/audit_exported_components.py --merged app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
    - name: Verify release APK signing certificate
      if: env.NEXAFLOW_SIGNING_CONFIGURED == 'true'
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        echo "=== Release APK signing certificate ==="
        "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
          | grep -E "Signer|CN=|SHA-256" || true
        echo ""
        echo "Compare the SHA-256 above with the expected certificate."
        echo "If they differ, the CI secrets contain a different keystore than local builds."
    - name: Verify packaged phone-state permission manifest
      run: python3 scripts/check_apk_phone_permission.py app/build/outputs/apk/release/app-release.apk
    - name: Verify dependency verification metadata is up to date
      run: |
        cp gradle/verification-metadata.xml /tmp/verification-metadata.expected.xml
        ./gradlew --write-verification-metadata sha256 :app:assembleDebug --console=plain
        python3 scripts/check_verification_metadata.py \
          /tmp/verification-metadata.expected.xml gradle/verification-metadata.xml
    - name: Verify 16 KB page-size alignment of native libraries
      run: python3 scripts/check_16kb.py app/build/outputs/apk/release/app-release.apk
    - name: Verify APK signature (v1/v2/v3)
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        echo "== APK signature verification (verbose) =="
        "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
        # Gate: at least one modern signature scheme (v2 or v3) must verify.
        "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk \
          | grep -E "Verified using v(2|3) scheme.*: true"
    - name: Verify production certificate matches keystore on version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
      run: |
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        EXPECTED="$(keytool -list -v -keystore keystore/nexaflow-release.jks -storepass "$NEXAFLOW_KEYSTORE_PASSWORD" -alias "$NEXAFLOW_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        ACTUAL="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$EXPECTED" || { echo "Could not read the release-keystore certificate fingerprint." >&2; exit 1; }
        test -n "$ACTUAL" || { echo "Could not read the APK certificate fingerprint." >&2; exit 1; }
        test "$EXPECTED" = "$ACTUAL" || { echo "APK certificate does not match the production keystore." >&2; exit 1; }
        echo "APK certificate matches the configured production keystore."
    - name: Verify zipalign (4 KB + 16 KB native page alignment)
      run: |
        ZIPALIGN="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/zipalign | sort -V | tail -1)"
        "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk
    - name: Verify watch APK signature and certificate on version tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NEXAFLOW_KEYSTORE_PASSWORD: ${{ secrets.NEXAFLOW_KEYSTORE_PASSWORD }}
        NEXAFLOW_KEY_ALIAS: ${{ secrets.NEXAFLOW_KEY_ALIAS }}
      run: |
        WATCH_APK=wear/build/outputs/apk/release/wear-release.apk
        test -s "$WATCH_APK" || { echo "Watch release APK missing: $WATCH_APK" >&2; exit 1; }
        APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)"
        "$APKSIGNER" verify --verbose "$WATCH_APK" | grep -E "Verified using v(2|3) scheme.*: true"
        EXPECTED="$(keytool -list -v -keystore keystore/nexaflow-release.jks -storepass "$NEXAFLOW_KEYSTORE_PASSWORD" -alias "$NEXAFLOW_KEY_ALIAS" 2>/dev/null | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        ACTUAL="$("$APKSIGNER" verify --print-certs "$WATCH_APK" | awk -F'digest: ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
        test -n "$EXPECTED" || { echo "Could not read the release-keystore certificate fingerprint." >&2; exit 1; }
        test -n "$ACTUAL" || { echo "Could not read the watch APK certificate fingerprint." >&2; exit 1; }
        test "$EXPECTED" = "$ACTUAL" || { echo "Watch APK certificate does not match the production keystore." >&2; exit 1; }
        echo "Watch APK certificate matches the production keystore."
    - name: Build release AAB
      run: ./gradlew bundleRelease
    - name: Download bundletool
      run: curl -fsSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
    - name: bundletool - validate bundle and measure per-ABI size
      run: |
        BUNDLE=app/build/outputs/bundle/release/app-release.aab
        keytool -genkeypair -keystore ci-debug.keystore -storepass android -keypass android \
          -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
          -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1
        KS=(--ks=ci-debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android)
        echo "== Bundle manifest (validates the AAB) =="
        java -jar bundletool.jar dump manifest --bundle="$BUNDLE" \
          | grep -E "package=|versionCode|versionName|minSdkVersion|targetSdkVersion"
        java -jar bundletool.jar build-apks --bundle="$BUNDLE" --output=apks-splits.apks "${KS[@]}"
        java -jar bundletool.jar build-apks --bundle="$BUNDLE" --output=apks-universal.apks --mode=universal "${KS[@]}"
        echo "== Estimated download size - per-device splits (bytes, min..max) =="
        java -jar bundletool.jar get-size total --apks=apks-splits.apks | tail -1
        echo "== Estimated download size - universal (all ABIs) APK (bytes) =="
        java -jar bundletool.jar get-size total --apks=apks-universal.apks | tail -1
        echo "== Native-library splits per ABI (bytes) =="
        unzip -l apks-splits.apks | grep -E "base-(arm64_v8a|armeabi_v7a|x86_64|x86)\.apk" \
          | awk '{printf "  %-24s %s bytes\n", $4, $1}'
    - name: Audit native libraries (ABI + size)
      run: python3 scripts/check_apk_libs.py app/build/outputs/apk/release/app-release.apk
    - name: Upload Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload Release APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    - name: Upload Watch Release APK
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-wear-release-apk
        path: wear/build/outputs/apk/release/wear-release.apk
    - name: Upload Release AAB
      uses: actions/upload-artifact@v7
      with:
        name: nexaflow-release-aab
        path: app/build/outputs/bundle/release/app-release.aab

  release:
    name: Publish tagged release
    needs: [lint, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: nexaflow-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::Invalid release tag '$TAG'."
            exit 1
          }
          python3 scripts/audit_catalog_and_releases.py tag-changelog "$TAG"

      - name: Download phone APK
        uses: actions/download-artifact@v7
        with:
          name: nexaflow-release-apk
          path: release-assets/phone

      - name: Download Wear OS APK
        uses: actions/download-artifact@v7
        with:
          name: nexaflow-wear-release-apk
          path: release-assets/wear

      - name: Download Android App Bundle
        uses: actions/download-artifact@v7
        with:
          name: nexaflow-release-aab
          path: release-assets/aab

      - name: Prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          BUNDLE="NexaFlow-$TAG.aab"
          cp release-assets/phone/app-release.apk "$PHONE"
          cp release-assets/wear/wear-release.apk "$WEAR"
          cp release-assets/aab/app-release.aab "$BUNDLE"
          test -s "$PHONE"
          test -s "$WEAR"
          test -s "$BUNDLE"
          sha256sum "$PHONE" | awk '{print $1}' > "$PHONE.sha256"
          sha256sum "$WEAR" | awk '{print $1}' > "$WEAR.sha256"
          sha256sum "$BUNDLE" | awk '{print $1}' > "$BUNDLE.sha256"
          for checksum in "$PHONE.sha256" "$WEAR.sha256" "$BUNDLE.sha256"; do
            grep -Eq '^[0-9a-f]{64}$' "$checksum" || {
              echo "::error::Invalid SHA-256 file $checksum"
              exit 1
            }
          done
          python3 scripts/generate_release_notes.py "$TAG" > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          BUNDLE="NexaFlow-$TAG.aab"
          PHONE_SHA="$PHONE.sha256"
          WEAR_SHA="$WEAR.sha256"
          BUNDLE_SHA="$BUNDLE.sha256"
          PRERELEASE=()
          [[ "$TAG" == *-* ]] && PRERELEASE=(--prerelease)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PHONE" "$PHONE_SHA" "$WEAR" "$WEAR_SHA" "$BUNDLE" "$BUNDLE_SHA" --clobber
            gh release edit "$TAG" --title "NexaFlow $TAG" --notes-file release-notes.md "${PRERELEASE[@]}"
          else
            gh release create "$TAG" "$PHONE" "$PHONE_SHA" "$WEAR" "$WEAR_SHA" "$BUNDLE" "$BUNDLE_SHA" \
              --verify-tag \
              --title "NexaFlow $TAG" \
              --notes-file release-notes.md \
              "${PRERELEASE[@]}"
          fi

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          PHONE="NexaFlow-$TAG.apk"
          WEAR="NexaFlow-Wear-$TAG.apk"
          BUNDLE="NexaFlow-$TAG.aab"
          PHONE_SHA="$PHONE.sha256"
          WEAR_SHA="$WEAR.sha256"
          BUNDLE_SHA="$BUNDLE.sha256"
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.tag_name' <<<"$RELEASE_JSON")" = "$TAG"
          test "$(jq -r '.draft' <<<"$RELEASE_JSON")" = "false"
          MISSING="$(jq \
            --arg phone "$PHONE" --arg phoneSha "$PHONE_SHA" \
            --arg wear "$WEAR" --arg wearSha "$WEAR_SHA" \
            --arg bundle "$BUNDLE" --arg bundleSha "$BUNDLE_SHA" \
            '[$phone, $phoneSha, $wear, $wearSha, $bundle, $bundleSha] - [.assets[].name] | length' \
            <<<"$RELEASE_JSON")"
          test "$MISSING" = "0"
          for ASSET in "$PHONE" "$PHONE_SHA" "$WEAR" "$WEAR_SHA" "$BUNDLE" "$BUNDLE_SHA"; do
            SIZE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .size' <<<"$RELEASE_JSON")"
            STATE="$(jq --arg name "$ASSET" -r '.assets[] | select(.name == $name) | .state' <<<"$RELEASE_JSON")"
            test -n "$SIZE" && test "$SIZE" -gt 0
            test "$STATE" = "uploaded"
          done
          echo "Release $TAG published and verified."

  # Branch integration is intentionally PR-only. The former consolidate job
  # merged every remote branch into main with incoming-branch conflict wins and
  # then deleted all branches. That made an arbitrary stale or experimental
  # branch capable of entering main without focused review. Keep integration at
  # the pull-request boundary where the normal lint/build gates apply.

  merge-dependabot-update:
    permissions:
      contents: write
      pull-requests: write
    # Do not check out or execute code from the pull request. This workflow
    # only asks GitHub to watch its required checks and merge the PR after they
    # pass, so it retains pull_request_target permissions safely.
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    steps:
      - name: Wait for all pull-request checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr checks "$PR_URL" --watch --fail-fast
      - name: Enable squash auto-merge after verified checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch

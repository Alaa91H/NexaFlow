name: Consolidate all branches

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  consolidate:
    if: contains(github.event.head_commit.message, '[merge-all-branches]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Merge every remote branch into main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git for-each-ref --sort=committerdate --format='%(refname:strip=3)' refs/remotes/origin               | grep -v -E '^(HEAD|main)$'
          )

          printf 'Branches to consolidate (%s):\n' "${#branches[@]}"
          printf ' - %s\n' "${branches[@]}"

          for branch in "${branches[@]}"; do
            echo "::group::Merging $branch"
            if git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "$branch is already contained in main."
              echo "::endgroup::"
              continue
            fi

            if git merge --no-ff --no-edit -X theirs "origin/$branch"; then
              echo "Merged $branch cleanly."
            else
              echo "Automatic merge reported conflicts; resolving remaining paths in favor of incoming branch $branch."
              mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
              for path in "${conflicts[@]}"; do
                if git cat-file -e "origin/$branch:$path" 2>/dev/null; then
                  git checkout "origin/$branch" -- "$path"
                  git add -- "$path"
                else
                  git rm -f -- "$path"
                fi
              done

              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "::error::Unresolved conflicts remain after deterministic resolution."
                git diff --name-only --diff-filter=U
                exit 1
              fi

              git add -A
              git commit --no-edit
            fi
            echo "::endgroup::"
          done

      - name: Verify every branch tip is integrated
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r branch; do
            case "$branch" in
              HEAD|main) continue ;;
            esac
            if ! git merge-base --is-ancestor "origin/$branch" HEAD; then
              echo "::error::$branch is not an ancestor of the integration result."
              failed=1
            fi
          done < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin)
          test "$failed" -eq 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up JDK 21 for tests
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run repository hygiene checks
        shell: bash
        run: |
          chmod +x gradlew
          python3 scripts/auto_fix.py --check
          python3 scripts/check_strings_parity.py
          python3 scripts/audit_translation_completeness.py --self-test
          python3 scripts/audit_translation_completeness.py
          python3 scripts/check_hardcoded_text.py --self-test
          python3 scripts/check_hardcoded_text.py
          python3 scripts/check_vendor_neutrality.py --self-test
          python3 scripts/check_vendor_neutrality.py

      - name: Run Gradle verification
        run: ./gradlew detekt lintDebug testDebugUnitTest assembleDebug

      - name: Push integrated main
        run: git push origin HEAD:main

      - name: Delete all branches except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin               | grep -v -E '^(HEAD|main)$'
          )
          for branch in "${branches[@]}"; do
            echo "Deleting remote branch $branch"
            git push origin --delete "$branch"
          done

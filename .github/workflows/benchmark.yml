name: Macrobenchmark

# Nightly startup measurement (NFA-12). The emulator is only a trend proxy:
# absolute numbers come from the physical matrix, but a regression on the same
# image and runner is actionable, and the budget gate fails the run.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    name: Cold-start macrobenchmark (API 36)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        fetch-tags: true
    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up Android SDK command-line tools
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
    - name: Grant Gradle execute permission
      run: chmod +x gradlew
    - name: Provision benchmark emulator
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager_path="$(readlink -f "$(command -v sdkmanager)")"
        sdk_root="$(dirname "$(dirname "$(dirname "$(dirname "$sdkmanager_path")")")")"
        echo "$sdk_root/emulator" >> "$GITHUB_PATH"
        export PATH="$sdk_root/emulator:$PATH"
        sudo apt-get update
        sudo apt-get install --yes libpulse0
        if [ -e /dev/kvm ]; then
          sudo chmod 666 /dev/kvm
        fi
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
        echo "no" | avdmanager create avd \
          --force \
          --name nexaflow-bench \
          --package "system-images;android-36;google_apis;x86_64" \
          --device "pixel_6"
    - name: Boot emulator
      shell: bash
      run: |
        set -euo pipefail
        nohup emulator -avd nexaflow-bench -no-window -noaudio -no-boot-anim \
          -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none \
          > "$RUNNER_TEMP/nexaflow-bench-emulator.log" 2>&1 &
        deadline=$((SECONDS + 300))
        until timeout 10s adb wait-for-device; do
          [ "$SECONDS" -ge "$deadline" ] && { cat "$RUNNER_TEMP/nexaflow-bench-emulator.log"; exit 1; }
          sleep 2
        done
        until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
          [ "$SECONDS" -ge "$deadline" ] && { cat "$RUNNER_TEMP/nexaflow-bench-emulator.log"; exit 1; }
          sleep 2
        done
        adb shell input keyevent 82 || true
        adb shell settings put global window_animation_scale 0
        adb shell settings put global transition_animation_scale 0
        adb shell settings put global animator_duration_scale 0
    - name: Run startup macrobenchmarks
      # The `benchmark` variants of :app and :macrobenchmark are non-debuggable
      # and R8-shrunk, so DEBUGGABLE is not suppressed. EMULATOR is a property
      # of this runner, and ACTIVITY-MISSING repeats the module's own value
      # because this property replaces it instead of merging.
      run: >-
        ./gradlew :macrobenchmark:connectedBenchmarkAndroidTest
        -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR,ACTIVITY-MISSING
        -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.profiling.mode=none
        --no-parallel --max-workers=2 --console=plain
    - name: Enforce startup budget
      run: |
        python3 -m unittest scripts.tests.test_benchmark_budget
        python3 scripts/check_benchmark_budget.py
    - name: Upload benchmark evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: benchmark-evidence
        if-no-files-found: ignore
        path: |
          macrobenchmark/build/outputs/connected_android_test_additional_output/**
          macrobenchmark/build/reports/androidTests/**

name: Feature request
description: Suggest an improvement for NexaFlow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions / capability impact
      description: Does this require a new Android permission, accessibility, Shizuku, root, hardware capability, or external service?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request is within the scope of the project.
          required: true
